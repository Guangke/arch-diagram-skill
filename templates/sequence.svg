<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-labelledby="title desc">
  <title id="title">用户登录序列图模板</title>
  <desc id="desc">四个参与方（客户端、API 网关、用户服务、数据库）的生命线与激活条，实线为同步调用、虚线为返回，演示一次登录请求的完整往返。</desc>

  <style>
    .compute { fill:#DBEAFE; stroke:#2563EB; stroke-width:1.5; }
    .infra   { fill:#F3F4F6; stroke:#4B5563; stroke-width:1.5; }
    .data    { fill:#DCFCE7; stroke:#16A34A; stroke-width:1.5; }
    .canvas  { fill:#FFFFFF; }
    .t-heading{ font:bold 18px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; fill:#1E293B; }
    .t-title { font:bold 14px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; fill:#1E293B; text-anchor:middle; }
    .t-label { font:12px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; fill:#334155; text-anchor:middle; }
    .t-note  { font:12px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; fill:#64748B; text-anchor:middle; }
    .lifeline{ stroke:#94A3B8; stroke-width:1; stroke-dasharray:4 4; }
    .act     { fill:#93C5FD; fill-opacity:0.55; }
    .msg     { stroke:#64748B; stroke-width:1.8; fill:none; marker-end:url(#arrow); }
    .msg-ret { stroke:#64748B; stroke-width:1.8; fill:none; stroke-dasharray:6 4; marker-end:url(#arrow-open); }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#FFFFFF" stroke="#475569" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="880" height="500"/>
  <text class="t-heading" x="40" y="34">用户登录时序（模板）</text>

  <!-- 参与方 / Participants -->
  <rect class="compute" x="65"  y="58" width="150" height="46" rx="8"/>
  <text class="t-title" x="140" y="86">客户端</text>
  <rect class="infra"   x="265" y="58" width="150" height="46" rx="8"/>
  <text class="t-title" x="340" y="86">API 网关</text>
  <rect class="compute" x="465" y="58" width="150" height="46" rx="8"/>
  <text class="t-title" x="540" y="86">用户服务</text>
  <rect class="data"    x="665" y="58" width="150" height="46" rx="8"/>
  <text class="t-title" x="740" y="86">数据库</text>

  <!-- 生命线 / Lifelines -->
  <line class="lifeline" x1="140" y1="104" x2="140" y2="470"/>
  <line class="lifeline" x1="340" y1="104" x2="340" y2="470"/>
  <line class="lifeline" x1="540" y1="104" x2="540" y2="470"/>
  <line class="lifeline" x1="740" y1="104" x2="740" y2="470"/>

  <!-- 激活条 / Activation bars -->
  <rect class="act" x="134" y="140" width="12" height="238"/>
  <rect class="act" x="334" y="140" width="12" height="238"/>
  <rect class="act" x="534" y="186" width="12" height="146"/>
  <rect class="act" x="734" y="232" width="12" height="54"/>

  <!-- 消息 / Messages -->
  <text class="t-label" x="238" y="140">POST /login</text>
  <line class="msg" x1="146" y1="148" x2="330" y2="148"/>

  <text class="t-label" x="438" y="186">verify(credentials)</text>
  <line class="msg" x1="346" y1="194" x2="530" y2="194"/>

  <text class="t-label" x="638" y="232">SELECT user</text>
  <line class="msg" x1="546" y1="240" x2="730" y2="240"/>

  <text class="t-label" x="638" y="278">user row</text>
  <line class="msg-ret" x1="730" y1="286" x2="550" y2="286"/>

  <text class="t-label" x="438" y="324">200 OK + token</text>
  <line class="msg-ret" x1="530" y1="332" x2="350" y2="332"/>

  <text class="t-label" x="238" y="370">200 OK</text>
  <line class="msg-ret" x1="330" y1="378" x2="150" y2="378"/>

  <!-- 说明 / Notes -->
  <text class="t-note" x="440" y="430">实线 = 同步调用；虚线 = 返回 / 异步</text>
  <text class="t-note" x="440" y="452">竖条（激活条）表示组件处理消息的时间窗</text>
</svg>
